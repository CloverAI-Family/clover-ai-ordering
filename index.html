<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ed">
  <title>Clover AI 點餐系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="回到首頁">
        <span class="brand-mark"><svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5h-5.8v-6.2H9.3V21H3.5a.5.5 0 0 1-.5-.5z"/></svg></span>
        <span><strong data-i18n="brandName">Clover AI 點餐系統</strong><small id="table-label">桌號 1</small></span>
      </button>
      <label class="language-picker">
        <span class="sr-only">Language</span>
        <select id="language-select" aria-label="Language">
          <option value="zh">繁中</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </label>
    </header>

    <main>
      <section id="home-view" class="view active">
        <div class="hero">
          <p class="eyebrow" data-i18n="welcome">歡迎使用 Clover AI 點餐系統</p>
          <div class="hero-logo" aria-hidden="true"><img src="assets/clover-ai-family-logo.png" alt=""></div>
          <h1 data-i18n="heroTitle">今天想吃點什麼？</h1>
          <p data-i18n="heroBody">不用下載 App，直接開始點餐。</p>
        </div>
        <div class="home-actions">
          <button class="primary large" data-action="open-menu">
            <span>☕</span><span><b data-i18n="normalOrder">一般點餐</b><small data-i18n="normalHint">瀏覽完整菜單</small></span>
          </button>
          <button class="secondary large" data-action="open-ai">
            <span>✦</span><span><b data-i18n="aiOrder">AI 點餐</b><small data-i18n="aiHint">下一階段開放</small></span>
          </button>
        </div>
      </section>

      <section id="menu-view" class="view">
        <div class="section-heading">
          <div><p class="eyebrow" data-i18n="menuEyebrow">台灣早餐</p><h1 data-i18n="menuTitle">選擇餐點</h1></div>
          <span class="table-chip" id="menu-table">桌號 1</span>
        </div>
        <div id="category-tabs" class="tabs" role="tablist"></div>
        <div id="menu-grid" class="menu-grid"></div>
      </section>

      <section id="ai-view" class="view ai-view">
        <div class="section-heading ai-scene-head">
          <button class="ai-exit" data-action="home" aria-label="返回首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5h-5.8v-6.2H9.3V21H3.5a.5.5 0 0 1-.5-.5z"/></svg></button>
          <span aria-hidden="true"></span>
          <button class="text-button" data-action="reset-ai" data-i18n="restart">重新開始</button>
        </div>
        <div class="ai-stage">
          <div id="particle-field" class="particle-field" aria-hidden="true"></div>
          <div id="ai-orb" class="ai-orb neutral" aria-hidden="true"></div>
          <p id="ai-message" class="ai-message" role="status" aria-live="polite"></p>
          <ol id="guide-progress" class="guide-progress hidden" aria-label="點餐進度"></ol>
          <div id="ai-controls" class="ai-controls"></div>
          <div id="ai-results" class="ai-results"></div>
          <p id="ai-disclaimer" class="disclaimer hidden"></p>
          <button id="ai-summary" class="ai-summary hidden" data-action="open-cart"></button>
          <form id="ai-chat-bar" class="ai-chat-bar">
            <input id="ai-chat-input" type="text" autocomplete="off" placeholder="輸入餐點需求……" aria-label="輸入餐點需求">
            <button id="ai-microphone" type="button" data-action="voice-demo" aria-label="開始語音輸入">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg>
            </button>
          </form>
        </div>
      </section>

      <section id="cart-view" class="view">
        <div class="section-heading"><div><p class="eyebrow" data-i18n="orderSummary">訂單確認</p><h1 data-i18n="yourCart">你的購物車</h1></div></div>
        <div class="notebook">
          <div id="cart-list" class="cart-list"></div>
          <div id="cart-empty" class="empty-state"><span>🧺</span><p data-i18n="emptyCart">購物車還是空的</p></div>
        </div>
        <div class="cart-total"><span data-i18n="total">合計</span><strong id="cart-total">NT$0</strong></div>
        <div class="cart-actions">
          <button class="secondary" data-action="open-menu" data-i18n="continueOrder">繼續點餐</button>
          <button id="submit-order" class="primary" data-action="submit-order" data-i18n="sendOrder">送出訂單</button>
        </div>
      </section>

      <section id="success-view" class="view success-view">
        <div class="success-icon">✓</div>
        <p class="eyebrow" data-i18n="orderReceived">示範流程完成</p>
        <h1 data-i18n="orderSent">示範訂單已建立</h1>
        <p data-i18n="orderWait">訂單沒有傳送至真實廚房或店員。這個畫面只用於展示點餐流程。</p>
        <button class="primary" data-action="new-order" data-i18n="newOrder">重新點餐</button>
      </section>
    </main>

    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="主要導覽">
      <button data-action="waiter"><span>🔔</span><small data-i18n="waiter">叫服務員</small></button>
      <button data-action="open-menu"><span>☰</span><small data-i18n="menu">菜單</small></button>
      <button data-action="open-ai"><span>✦</span><small data-i18n="aiNav">AI 推薦</small></button>
      <button data-action="open-cart" class="cart-nav"><span>🛒</span><small data-i18n="cart">購物車</small><b id="cart-count">0</b></button>
    </nav>
  </div>

  <dialog id="item-dialog" class="item-dialog">
    <form method="dialog">
      <button class="dialog-close" value="cancel" aria-label="關閉">×</button>
    </form>
    <div id="dialog-image" class="dialog-image"></div>
    <div class="dialog-body">
      <p id="dialog-category" class="eyebrow"></p>
      <div class="dialog-title"><h2 id="dialog-name"></h2><strong id="dialog-price"></strong></div>
      <p id="dialog-description" class="muted"></p>
      <div id="dialog-options"></div>
      <div class="quantity-row">
        <span data-i18n="quantity">數量</span>
        <div class="stepper"><button type="button" data-action="quantity-down">−</button><b id="quantity">1</b><button type="button" data-action="quantity-up">＋</button></div>
      </div>
      <button class="primary full" data-action="add-to-cart" data-i18n="addToCart">加入購物車</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="ordering-core.js"></script>
  <script src="main.js"></script>
</body>
</html>
